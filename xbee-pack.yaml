schema-version: 1.0

description: |
  Installs Apache Maven 3.8.8 from a versioned archive.
  The SHA-256 below was computed after checking the downloaded archive
  against the SHA-512 published by Apache at:
  https://archive.apache.org/dist/maven/maven-3/3.8.8/binaries/apache-maven-3.8.8-bin.tar.gz.sha512
  Changing xbee.version requires updating archiveSha256 as well.
  Requires an xbee guest binary supporting url.sha256.

var:
  xbee:
    version: "3.8.8"
  archiveSha256: 17811e108701af5985bf5167abbd47c06e92c6c6bd1c13a1a1c095c9b4ecc32a

dependency:
  origin: aws-jdk
  alias: jdk

env:
  MAVEN_OPTS: "--enable-native-access=ALL-UNNAMED"

provision:
  - url:
      from: https://archive.apache.org/dist/maven/maven-3/{{ .xbee.version }}/binaries/apache-maven-{{ .xbee.version }}-bin.tar.gz
      sha256: '{{ .archiveSha256 }}'
  - systempath: '{{ .xbee.install }}/apache-maven-{{ .xbee.version }}/bin'


bind:
  repo:
    from: $HOME/.m2
    to: /home/{{ .xbee.user }}/.m2

command:
  mvn: mvn
